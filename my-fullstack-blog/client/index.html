<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <style>
  #initial-loader {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
  }

  .initial-spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #e5e7eb;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: initial-spin 0.8s linear infinite;
  }

  @keyframes initial-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
  </head>
  <body>
     <div id="initial-loader">
    <div class="initial-spinner"></div>
  </div>
    <div id="root"></div>
    <script type="module" src="/src/components/main.tsx"></script>
  </body>
</html>
