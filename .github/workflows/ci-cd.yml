name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my-fullstack-blog

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-fullstack-blog/client/package-lock.json

      - run: npm ci --prefix client

      - run: npm run lint --prefix client

      - run: npm run build --prefix client

      - run: docker build -f Dockerfile -t my-fullstack-blog .

      - name: Check container health
        run: |
          docker run -d --name blog -p 5500:5500 \
            -e PORT=5500 \
            -e DATABASE_URL=file:./dev.db \
            -e JWT_SECRET=test-secret \
            -e NODE_ENV=production \
            my-fullstack-blog

          for i in {1..15}; do
            if curl --fail --silent http://localhost:5500/api/health; then
              docker rm -f blog
              exit 0
            fi
            sleep 2
          done

          docker logs blog
          exit 1
