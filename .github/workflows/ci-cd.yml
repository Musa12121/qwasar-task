name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my-deployed-app

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DATABASE_URL_UNPOOLED: postgresql://test:test@localhost:5432/test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci --prefix client
      - run: npm ci --prefix server

      - name: Generate Prisma client
        working-directory: my-deployed-app/server
        run: npx prisma generate

      - run: npm run lint --prefix client
      - run: npm run lint --prefix server
      - run: npm test --prefix server
      - run: npm run build --prefix client

  build-docker:
    name: Build Docker Image
    needs: lint-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        working-directory: my-deployed-app
        run: docker build -t my-deployed-app .

  deploy:
    name: Deploy
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
